version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: fda_tracker_db
    environment:
      POSTGRES_DB: ${DB_NAME:-fdatracker}
      POSTGRES_USER: ${DB_USER:-fdauser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fdapassword}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fdauser}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fda_tracker_backend
    environment:
      DATABASE_URL: postgresql://${DB_USER:-fdauser}:${DB_PASSWORD:-fdapassword}@db:5432/${DB_NAME:-fdatracker}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-fdatracker}
      DB_USER: ${DB_USER:-fdauser}
      DB_PASSWORD: ${DB_PASSWORD:-fdapassword}
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend (Development mode)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fda_tracker_frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api}
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local

networks:
  default:
    name: fda_tracker_network
